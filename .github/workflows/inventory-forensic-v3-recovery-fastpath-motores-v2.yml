name: inventory-forensic-v3-recovery-fastpath-motores-v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inventory-forensic-v3-recovery-fastpath-motores-v2.yml"

permissions:
  contents: read

jobs:
  recover_fastpath:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
      - name: Fast manifest-to-ZIP mapping
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          mkdir -p audit-v3-fastpath
          git ls-tree -r --name-only HEAD > /tmp/paths.txt
          python3 - <<'PY'
          import json, os, re, subprocess
          from collections import Counter, defaultdict
          repo=os.environ['REPOSITORY']; run=os.environ['RUN_ID']; server=os.environ['SERVER_URL']
          paths=[x.rstrip('\n') for x in open('/tmp/paths.txt',encoding='utf-8',errors='replace')]
          manifests=[p for p in paths if p.endswith('RESEARCH_DOWNLOAD_MANIFEST.jsonl')]
          zip_re=re.compile(r'(?i)^(.*)_([0-9]{4})\.zip$')
          by_norm=defaultdict(list)
          def norm(x): return re.sub(r'[^a-z0-9]+','',str(x).lower())
          for p in paths:
            m=zip_re.match(os.path.basename(p))
            if m: by_norm[norm(m.group(1))].append((p,int(m.group(2))))
          def show(p): return subprocess.check_output(['git','show','HEAD:'+p],text=True,errors='replace')
          def srcname(u):
            x=str(u or '').rstrip('/')
            if x.lower().endswith('.git'): x=x[:-4]
            return x.rsplit('/',1)[-1]
          rows=[]; excluded=[]; errors=[]
          for mf in manifests:
            for ln,line in enumerate(show(mf).splitlines(),1):
              if not line.strip(): continue
              try: d=json.loads(line)
              except Exception: errors.append({'manifest':mf,'line':ln,'error':'invalid_json'}); continue
              if not isinstance(d,dict): continue
              status0=str(d.get('status') or '').upper()
              source=d.get('source') or d.get('source_url')
              sha=d.get('source_commit') or d.get('commit') or d.get('sha')
              slug=str(d.get('slug') or d.get('name') or '').strip()
              try: expected=int(d.get('parts'))
              except Exception: expected=None
              sha_ok=isinstance(sha,str) and bool(re.fullmatch(r'[0-9a-fA-F]{40}',sha))
              source_ok=isinstance(source,str) and source.startswith(('https://','http://'))
              if status0=='SKIPPED' and not sha_ok and expected is None:
                excluded.append({'slug':slug,'source':source,'manifest':mf,'line':ln,'classification':'EXCLUDED_NON_DOWNLOADED'})
                continue
              wanted={norm(slug),norm(srcname(source))}; wanted.discard('')
              matches=[]
              for w in wanted:
                for p,n in by_norm.get(w,[]): matches.append((p,n))
              dirs=defaultdict(list)
              for p,n in matches: dirs[os.path.dirname(p)].append((p,n))
              exact=[]
              if expected is not None:
                for dr,items in dirs.items():
                  nums=sorted(n for _,n in items)
                  if nums==list(range(1,expected+1)):
                    exact.append({'directory':dr,'files':[p for p,_ in sorted(items,key=lambda z:z[1])]})
              if not source_ok or not sha_ok: st='INSUFFICIENT_EVIDENCE'
              elif not exact: st='GAP'
              elif len(exact)>1: st='DUPLICATE_RELOCATED'
              else: st='COMPLETE'
              canon=str(source or '').rstrip('/')
              if canon.lower().endswith('.git'): canon=canon[:-4]
              canon=canon.lower()
              rows.append({'canonical_id':canon,'canonical_name':slug or srcname(source),'source_url':source,'source_commit':sha if sha_ok else 'INSUFFICIENT_EVIDENCE','manifest_path':mf,'zip_parts':expected,'status':st,'locations':exact,'exact_path':'; '.join(x['directory'] for x in exact) if exact else 'INSUFFICIENT_EVIDENCE'})
          # deduplicate URL+SHA while retaining all locations
          merged={}
          for r in rows:
            k=(r['canonical_id'],r['source_commit'])
            if k not in merged: merged[k]=r
            else:
              have={x['directory'] for x in merged[k]['locations']}
              for loc in r['locations']:
                if loc['directory'] not in have: merged[k]['locations'].append(loc); have.add(loc['directory'])
              merged[k]['exact_path']='; '.join(x['directory'] for x in merged[k]['locations']) or 'INSUFFICIENT_EVIDENCE'
              if merged[k]['status']=='COMPLETE' and len(merged[k]['locations'])>1: merged[k]['status']='DUPLICATE_RELOCATED'
          comps=list(merged.values()); c=Counter(x['status'] for x in comps)
          result={'schema':'YAIWES-INVENTORY-INDEXES-V3-FASTPATH','repository':repo,'branch':'main','workflow_run_url':f'{server}/{repo}/actions/runs/{run}','manifests':manifests,'components':comps,'excluded_non_downloaded':excluded,'errors':errors,'counts':{'manifest_rows':len(rows)+len(excluded),'unique_versions':len(comps),'complete':c['COMPLETE'],'duplicate_relocated':c['DUPLICATE_RELOCATED'],'gaps':c['GAP'],'insufficient_evidence':c['INSUFFICIENT_EVIDENCE'],'excluded_non_downloaded':len(excluded)}}
          open('audit-v3-fastpath/inventory-recovery-v3.json','w').write(json.dumps(result,ensure_ascii=False,indent=2))
          open('audit-v3-fastpath/inventory-recovery-v3.md','w').write('# Fast-path recovery V3\n\n'+ '\n'.join(f'- {k}: {v}' for k,v in result['counts'].items()))
          PY
      - name: Validate evidence
        run: python3 -m json.tool audit-v3-fastpath/inventory-recovery-v3.json >/dev/null
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: inventory-forensic-v3-fastpath-motores-v2
          path: audit-v3-fastpath/
          if-no-files-found: error
          retention-days: 30
