name: OpenClaw Option C - Official Docker Setup Test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/openclaw-smoke-test.yml'

jobs:
  official-docker-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenClaw v2026.7.1-2
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: v2026.7.1-2
          fetch-depth: 1

      - name: Verify Docker and Compose
        run: |
          docker --version
          docker compose version

      - name: Run official OpenClaw Docker setup with prebuilt image
        env:
          OPENCLAW_IMAGE: ghcr.io/openclaw/openclaw:2026.7.1-2
          OPENCLAW_SKIP_ONBOARDING: '1'
        run: ./scripts/docker/setup.sh

      - name: Verify gateway container
        run: |
          docker compose ps
          docker compose logs --tail=200 openclaw-gateway

      - name: Verify OpenClaw health
        run: |
          docker compose run --rm openclaw-cli health --json

      - name: Verify OpenClaw doctor
        run: |
          docker compose run --rm openclaw-cli doctor --json

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail=300 openclaw-gateway || true
          docker compose run --rm openclaw-cli health --json || true

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans || true
