name: OpenClaw Option A - Image Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/openclaw-smoke-test.yml'

jobs:
  option-a:
    runs-on: ubuntu-latest
    steps:
      - name: Pull exact OpenClaw image
        run: docker pull ghcr.io/openclaw/openclaw:2026.7.1-2

      - name: Verify image metadata
        run: |
          docker image inspect ghcr.io/openclaw/openclaw:2026.7.1-2

      - name: Verify OpenClaw executable
        run: |
          docker run --rm ghcr.io/openclaw/openclaw:2026.7.1-2 --version
