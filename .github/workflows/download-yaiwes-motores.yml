name: Research Download Chain FINAL
run-name: Research Download Chain FINAL • ${{ github.event_name }} • ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-download-chain-yaiwes-motores
  cancel-in-progress: false

jobs:
  download-20-in-queue:
    name: Download 20 repos sequentially
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Execute deterministic download chain
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/research_download_yaiwes_motores.py 'Core kernel razonamiento repo para Yaiwes' '_work/yaiwes-motores'
