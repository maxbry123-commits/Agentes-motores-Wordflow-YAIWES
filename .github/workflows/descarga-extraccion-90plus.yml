name: Wordflow — Inventario 01-96 — Download ZIP + Extract

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descarga-extraccion:
    runs-on: ubuntu-latest
    steps:
      - name: Paso 1 - Descargar ZIP todos los repos 01-96
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/INVENTARIO_01_96.tsv
          test "$(wc -l < .github/workflows/INVENTARIO_01_96.tsv)" -eq 96
          mkdir -p .download-queue
          while IFS=$'\t' read -r number name repo; do
            test -n "$number" && test -n "$name" && test -n "$repo"
            slug=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9][^a-z0-9]*#-#g; s#^-##; s#-$##')
            branch=$(git ls-remote --symref "$repo.git" HEAD 2>/dev/null | awk '/^ref:/ {sub("refs/heads/", "", $2); print $2; exit}')
            test -n "$branch"
            curl --fail --location --retry 3 --retry-delay 2 -o ".download-queue/$slug.zip" "https://github.com/$(printf '%s' "$repo" | sed 's#https://github.com/##')/archive/refs/heads/$branch.zip"
          done < .github/workflows/INVENTARIO_01_96.tsv

      - name: Paso 2 - Extraer cada ZIP en su raíz exacta
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r number name repo; do
            slug=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9][^a-z0-9]*#-#g; s#^-##; s#-$##')
            zip=".download-queue/$slug.zip"
            root="$name"
            rm -rf "$root"
            mkdir -p "$root"
            tmp=$(mktemp -d)
            unzip -q "$zip" -d "$tmp"
            entries=("$tmp"/*)
            test "${#entries[@]}" -eq 1
            extracted="${entries[0]}"
            cp -a "$extracted"/. "$root"/
            rm -rf "$tmp"
          done < .github/workflows/INVENTARIO_01_96.tsv
          git add .
          git diff --cached --quiet || git commit -m "Wordflow: inventario 01-96 descarga ZIP y extracción"
          git push origin HEAD:main
