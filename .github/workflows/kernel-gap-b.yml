name: Kernel gap B K27-K35
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dest-main-serial
  cancel-in-progress: false
env:
  GIT_LFS_SKIP_SMUDGE: '1'
jobs:
  descarga-extraccion:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: ZIP gap B
        run: |
          set -euo pipefail
          git lfs uninstall --local || true
          sudo apt-get update -y && sudo apt-get install -y zip unzip
          python3 scripts/research_download_kernel_b.py 'Core kernel razonamiento repo para Yaiwes' '_work/kernel-b'
      - name: EXTRACT kernel
        run: python3 scripts/extract_kernel.py 'Core kernel razonamiento repo para Yaiwes'
