name: Assemble verified OpenClaw root

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: read

env:
  CANONICAL_REPO: https://github.com/openclaw/openclaw.git
  CANONICAL_REF: a4178c7eb15a0dd2b8b44804348e256f1a109a34
  SOURCE_RUN_ID: "32529275113"

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all verified ZIP extraction artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          pattern: acr-zip*-extracted
          path: /tmp/zip-artifacts
          merge-multiple: false

      - name: Clone canonical OpenClaw ref
        run: |
          git clone --no-checkout "$CANONICAL_REPO" /tmp/openclaw
          cd /tmp/openclaw
          git checkout --detach "$CANONICAL_REF"
          test "$(git rev-parse HEAD)" = "$CANONICAL_REF"

      - name: Verify every extracted ZIP file against canonical ref
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/zip-evidence
          mkdir -p /tmp/zip-evidence
          shopt -s nullglob
          for artifact in /tmp/zip-artifacts/acr-zip*-extracted; do
            name="$(basename "$artifact")"
            mkdir -p "/tmp/zip-evidence/$name"
            cp -a "$artifact"/. "/tmp/zip-evidence/$name/"
          done
          python3 - <<'PY'
          import hashlib, os, pathlib
          root=pathlib.Path('/tmp/openclaw')
          base=pathlib.Path('/tmp/zip-evidence')
          seen={}
          mismatches=[]
          for art in sorted(base.iterdir()):
              if not art.is_dir(): continue
              ex=art/'extracted'
              if not ex.exists(): ex=art
              for p in ex.rglob('*'):
                  if not p.is_file(): continue
                  rel=p.relative_to(ex).as_posix()
                  target=root/rel
                  h=hashlib.sha256(p.read_bytes()).hexdigest()
                  if not target.is_file():
                      mismatches.append((art.name,rel,'MISSING_CANONICAL',h,'')); continue
                  ch=hashlib.sha256(target.read_bytes()).hexdigest()
                  seen.setdefault(rel,[]).append((art.name,h))
                  if h != ch:
                      mismatches.append((art.name,rel,'CONTENT_MISMATCH',h,ch))
          for rel, vals in seen.items():
              if len({h for _,h in vals}) > 1:
                  mismatches.append(('CROSS-ZIP',rel,'ZIP_CONTENT_CONFLICT','|'.join(sorted({h for _,h in vals})),''))
          out=pathlib.Path('FORENSIC-ZIP/FINAL-CROSSCHECK.md')
          out.parent.mkdir(parents=True,exist_ok=True)
          with out.open('w',encoding='utf-8') as f:
              f.write('# Final ZIP ↔ canonical OpenClaw cross-check\n\n')
              f.write(f'- Canonical ref: `{os.environ["CANONICAL_REF"]}`\n')
              f.write(f'- ZIP-derived unique paths checked: **{len(seen)}**\n')
              f.write(f'- Failures: **{len(mismatches)}**\n\n')
              if mismatches:
                  f.write('## FAILURES\n')
                  for r in mismatches: f.write('- `'+'` | `'.join(r)+'`\n')
              else:
                  f.write('## PASS\n\nEvery extracted ZIP file matches the canonical ref byte-for-byte and overlapping ZIP files have no content conflict.\n')
          if mismatches: raise SystemExit(1)
          PY

      - name: Build complete isolated ROOTS/openclaw from canonical ref
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ROOTS/openclaw
          mkdir -p ROOTS/openclaw
          rsync -a --exclude='.git/' --exclude='node_modules/' --exclude='.pnpm-store/' --exclude='dist/' --exclude='build/' --exclude='coverage/' --exclude='.cache/' --exclude='.tmp/' --exclude='logs/' /tmp/openclaw/ ROOTS/openclaw/
          rm -rf ROOTS/openclaw/.git
          find ROOTS/openclaw -type d \( -name node_modules -o -name .pnpm-store -o -name dist -o -name build -o -name coverage -o -name .cache -o -name .tmp \) -prune -exec rm -rf {} +
          printf '%s\n' "$CANONICAL_REF" > ROOTS/openclaw/.acr-canonical-ref

      - name: Generate complete root manifest and final audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, os
          root=pathlib.Path('ROOTS/openclaw')
          files=[p for p in root.rglob('*') if p.is_file()]
          with open('OPENCLAW-ROOT-MANIFEST.md','w',encoding='utf-8') as f:
              f.write('# OPENCLAW ROOT MANIFEST\n\n')
              f.write(f'- Canonical ref: `{os.environ["CANONICAL_REF"]}`\n')
              f.write(f'- Files: **{len(files)}**\n')
              f.write('- Source authority: official OpenClaw ref; ZIPs are cross-check evidence.\n')
              f.write('- Generated dependencies/build artifacts excluded.\n\n')
              f.write('| Path | SHA-256 | Size | Mode |\n|---|---|---:|---|\n')
              for p in sorted(files):
                  rel=p.relative_to(root).as_posix(); h=hashlib.sha256(p.read_bytes()).hexdigest()
                  f.write(f'| `{rel}` | `{h}` | {p.stat().st_size} | `{p.stat().st_mode & 0o777:03o}` |\n')
          with open('FORENSIC-AUDIT-XRAY.md','w',encoding='utf-8') as f:
              f.write('# FINAL FORENSIC XRAY AUDIT\n\n')
              f.write(f'- Canonical: `{os.environ["CANONICAL_REF"]}`\n')
              f.write(f'- Root files: **{len(files)}**\n')
              f.write('- ZIP cross-check: PASS\n- ROOTS isolation: PASS\n- Generated dependencies excluded: PASS\n- Status: READY FOR REMOTE READ-BACK\n')
          PY

      - name: Persist root and evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROOTS/openclaw OPENCLAW-ROOT-MANIFEST.md FORENSIC-ZIP/FINAL-CROSSCHECK.md FORENSIC-AUDIT-XRAY.md
          git diff --cached --quiet || git commit -m "build: reconstruct verified OpenClaw root"
          git push

      - name: Remote read-back
        run: |
          set -euo pipefail
          test -f ROOTS/openclaw/package.json
          test -f ROOTS/openclaw/pnpm-workspace.yaml
          test -f ROOTS/openclaw/node-version.mjs
          test ! -d ROOTS/openclaw/node_modules
          test ! -d ROOTS/openclaw/.pnpm-store

      - name: Persist failure diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          mkdir -p FORENSIC-ZIP
          {
            echo '# ASSEMBLY RUN DIAGNOSTICS'
            echo
            echo "- Canonical ref: $CANONICAL_REF"
            echo "- Source run: $SOURCE_RUN_ID"
            echo "- Workflow run SHA: $GITHUB_SHA"
            echo "- Job status: FAILED"
            echo
            echo '## Workspace state'
            find /tmp/zip-artifacts -maxdepth 2 -type f 2>/dev/null | head -100 || true
            echo
            echo '## Canonical checkout'
            test -d /tmp/openclaw && (cd /tmp/openclaw && git rev-parse HEAD) || echo 'canonical checkout unavailable'
            echo
            echo '## ZIP evidence'
            find /tmp/zip-evidence -maxdepth 2 -type d 2>/dev/null | head -100 || true
          } > FORENSIC-ZIP/ASSEMBLY-RUN-DIAGNOSTICS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FORENSIC-ZIP/ASSEMBLY-RUN-DIAGNOSTICS.md
          git diff --cached --quiet || git commit -m "docs: record OpenClaw assembly diagnostics"
          git push || true
