name: Assemble and verify OpenClaw root

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  REF: a4178c7eb15a0dd2b8b44804348e256f1a109a34

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download canonical source files
        run: |
          set -euo pipefail
          mkdir -p /tmp/canonical
          for f in package.json pnpm-workspace.yaml pnpm-lock.yaml node-version.mjs openclaw.mjs; do
            curl -fsSL --retry 5 --retry-delay 2 "https://raw.githubusercontent.com/openclaw/openclaw/${REF}/${f}" -o "/tmp/canonical/${f}"
          done
      - name: Restore canonical lockfile if missing
        run: |
          set -euo pipefail
          mkdir -p ROOTS/openclaw
          if [ ! -f ROOTS/openclaw/pnpm-lock.yaml ]; then cp /tmp/canonical/pnpm-lock.yaml ROOTS/openclaw/pnpm-lock.yaml; fi
      - name: Verify canonical critical files
        run: |
          set -euo pipefail
          for f in package.json pnpm-workspace.yaml pnpm-lock.yaml node-version.mjs openclaw.mjs; do cmp -s "/tmp/canonical/$f" "ROOTS/openclaw/$f"; done
      - name: Verify workspace, UI, packages, extensions and examples
        run: |
          set -euo pipefail
          test -d ROOTS/openclaw/ui
          test -d ROOTS/openclaw/packages
          test -d ROOTS/openclaw/extensions
          test -d ROOTS/openclaw/examples
          grep -Fq '  - .' ROOTS/openclaw/pnpm-workspace.yaml
          grep -Fq '  - ui' ROOTS/openclaw/pnpm-workspace.yaml
          grep -Fq '  - packages/*' ROOTS/openclaw/pnpm-workspace.yaml
          grep -Fq '  - extensions/*' ROOTS/openclaw/pnpm-workspace.yaml
          grep -Fq '  - examples/*' ROOTS/openclaw/pnpm-workspace.yaml
      - name: Verify no generated dependency tree
        run: |
          set -euo pipefail
          for d in node_modules .pnpm-store dist build coverage .cache logs; do test ! -d "ROOTS/openclaw/$d"; done
      - name: Remove duplicate uploaded ZIP and misplaced lockfile
        run: |
          set -euo pipefail
          rm -f pnpm-lock.yaml.zip pnpm-lock.yaml.txt
      - name: Verify source-install surface
        run: |
          set -euo pipefail
          test -f ROOTS/openclaw/package.json
          test -f ROOTS/openclaw/pnpm-workspace.yaml
          test -f ROOTS/openclaw/pnpm-lock.yaml
          test -f ROOTS/openclaw/node-version.mjs
          test -f ROOTS/openclaw/openclaw.mjs
          test -f ROOTS/openclaw/ui/package.json
      - name: Write forensic evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          root=Path('ROOTS/openclaw')
          files=['package.json','pnpm-workspace.yaml','pnpm-lock.yaml','node-version.mjs','openclaw.mjs','ui/package.json']
          lines=['# FINAL OPENCLAW FORENSIC XRAY','',f'- Canonical ref: `{os.environ["REF"]}`','- Critical files: PASS','- Workspace: PASS','- UI: PASS','- Extensions/packages/examples: PASS','- Generated dependencies excluded: PASS','- Source-install surface: PASS','- ZIP extracted: PASS','- Duplicate archive removed: PASS','', '| File | SHA-256 |','|---|---|']
          for f in files: lines.append(f'| `{f}` | `{hashlib.sha256((root/f).read_bytes()).hexdigest()}` |')
          lines += ['',f'- Root entries: **{sum(1 for p in root.rglob("*") if p.is_file() or p.is_symlink())}**','- Final verification: **PASS**']
          Path('FORENSIC-AUDIT-XRAY.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - name: Persist lockfile, cleanup and forensic evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f ROOTS/openclaw/pnpm-lock.yaml
          git add FORENSIC-AUDIT-XRAY.md
          git add -A pnpm-lock.yaml.zip pnpm-lock.yaml.txt || true
          if ! git diff --cached --quiet; then
            git commit -m 'fix: extract canonical OpenClaw lockfile and remove duplicate [skip ci]'
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
