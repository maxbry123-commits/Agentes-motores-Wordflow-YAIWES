name: Assemble verified OpenClaw root

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  TARGET_CANONICAL_REF: a4178c7eb15a0dd2b8b44804348e256f1a109a34
  ZIP_SOURCE_REF: 0790d9f593ad30c940ed93b5872a8cf6d6f3cf8c

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download official ZIP-source archive
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "https://github.com/openclaw/openclaw/archive/${ZIP_SOURCE_REF}.tar.gz" -o /tmp/zip-source.tar.gz
          mkdir -p /tmp/zip-source; tar -xzf /tmp/zip-source.tar.gz -C /tmp/zip-source --strip-components=1
      - name: Extract and classify all 8 repository ZIPs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/original-zips; mkdir -p /tmp/original-zips
          names=("zip 1 openclaw-2026.7.1-2 parte 1.zip" "zip 4 openclaw-2026.7.1-2.zip" "zip 5 openclaw-2026.7.1-2 (2).zip" "zip 5.1 openclaw-2026.7.1-2.zip" "zip 6 openclaw-2026.7.1-2.zip" "zip 7 openclaw-2026.7.1-2.zip" "zip 8 openclaw-2026.7.1-2.zip" "zip 9 open claw src.zip")
          i=0
          for n in "${names[@]}"; do test -f "$n"; i=$((i+1)); mkdir -p "/tmp/original-zips/zip$i"; unzip -q -o "$n" -d "/tmp/original-zips/zip$i"; done
          python3 - <<'PY'
          import hashlib,pathlib,os,stat,json
          release=pathlib.Path('/tmp/zip-source'); base=pathlib.Path('/tmp/original-zips')
          content_bad=[]; mode_bad=[]; symlink_flattened=[]; seen=set()
          def sig(p):
              s=p.lstat(); m=stat.S_IMODE(s.st_mode)
              if stat.S_ISLNK(s.st_mode): return ('symlink',os.readlink(p),m)
              return ('file',hashlib.sha256(p.read_bytes()).hexdigest(),m) if stat.S_ISREG(s.st_mode) else ('other',str(s.st_mode),m)
          for art in sorted(base.iterdir()):
              entries=[p for p in art.rglob('*') if p.is_file() or p.is_symlink()]
              top={p.relative_to(art).parts[0] for p in entries}
              root=art/next(iter(top)) if len(top)==1 and (art/next(iter(top))).is_dir() else art
              for p in entries:
                  rel=p.relative_to(root).as_posix(); seen.add(rel); t=release/rel
                  if not t.exists() and not t.is_symlink(): content_bad.append((art.name,rel,'MISSING')); continue
                  a,b=sig(p),sig(t)
                  if a[0]=='file' and b[0]=='symlink' and a[1]==b[1]: symlink_flattened.append((art.name,rel,a[2],b[2])); continue
                  if a[0]!=b[0] or (a[0]=='file' and a[1]!=b[1]) or (a[0]=='symlink' and a[1]!=b[1]): content_bad.append((art.name,rel,a,b)); continue
                  if a[2]!=b[2]: mode_bad.append((art.name,rel,a[2],b[2]))
          report=pathlib.Path('FORENSIC-ZIP/ZIP-SOURCE-CROSSCHECK.md'); report.parent.mkdir(parents=True,exist_ok=True)
          with report.open('w',encoding='utf-8') as f:
              f.write('# ZIP source cross-check — content vs metadata\n\n')
              f.write(f'- Release ref: `{os.environ["ZIP_SOURCE_REF"]}`\n- Unique paths: **{len(seen)}**\n- Content/type failures: **{len(content_bad)}**\n- Mode-only differences: **{len(mode_bad)}**\n- Symlinks flattened by ZIP transport: **{len(symlink_flattened)}**\n\n')
              f.write('## Interpretation\n\n')
              if content_bad: f.write('**CONTENT FAIL:** at least one path differs in content/type.\n')
              else: f.write('**CONTENT PASS:** all ZIP file contents match the official release; symlink entries whose payload is the link target are classified separately.\n')
              f.write('\n**METADATA:** mode/symlink fidelity is not trusted from these ZIPs; the final root is therefore built from the exact canonical ref.\n\n')
              for title,data in [('Content/type failures',content_bad),('Mode-only differences',mode_bad),('Flattened symlinks',symlink_flattened)]:
                  f.write(f'## {title} (first 200)\n')
                  for x in data[:200]: f.write('- `'+ ' | '.join(map(str,x)) +'`\n')
          status='CONTENT_PASS_METADATA_LOSS\n' if not content_bad and (mode_bad or symlink_flattened) else ('PASS\n' if not content_bad else 'CONTENT_MISMATCH\n')
          pathlib.Path('FORENSIC-ZIP/ZIP-SOURCE-STATUS.txt').write_text(status,encoding='utf-8')
          print(status.strip(), len(seen),len(content_bad),len(mode_bad),len(symlink_flattened))
          PY
      - name: Download exact target canonical archive
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "https://github.com/openclaw/openclaw/archive/${TARGET_CANONICAL_REF}.tar.gz" -o /tmp/target.tar.gz
          mkdir -p /tmp/target; tar -xzf /tmp/target.tar.gz -C /tmp/target --strip-components=1
      - name: Build complete isolated ROOTS/openclaw
        run: |
          set -euo pipefail
          rm -rf ROOTS/openclaw; mkdir -p ROOTS/openclaw
          rsync -a --exclude='.git/' --exclude='node_modules/' --exclude='.pnpm-store/' --exclude='dist/' --exclude='build/' --exclude='coverage/' --exclude='.cache/' --exclude='.tmp/' --exclude='logs/' /tmp/target/ ROOTS/openclaw/
          printf '%s\n' "$TARGET_CANONICAL_REF" > ROOTS/openclaw/.acr-canonical-ref
      - name: Generate manifest and final XRAY audit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,pathlib,os
          root=pathlib.Path('ROOTS/openclaw'); files=[p for p in root.rglob('*') if p.is_file() or p.is_symlink()]
          with open('OPENCLAW-ROOT-MANIFEST.md','w',encoding='utf-8') as f:
              f.write('# OPENCLAW ROOT MANIFEST\n\n'); f.write(f'- Target canonical ref: `{os.environ["TARGET_CANONICAL_REF"]}`\n- Entries: **{len(files)}**\n- Generated dependencies/build artifacts excluded.\n\n')
              f.write('| Path | Hash/Target | Size | Type | Mode |\n|---|---|---:|---|---|\n')
              for p in sorted(files):
                  s=p.lstat(); rel=p.relative_to(root).as_posix(); typ='symlink' if p.is_symlink() else 'file'; val=os.readlink(p) if p.is_symlink() else hashlib.sha256(p.read_bytes()).hexdigest(); size=len(val.encode()) if p.is_symlink() else s.st_size
                  f.write(f'| `{rel}` | `{val}` | {size} | `{typ}` | `{oct(s.st_mode & 0o777)}` |\n')
          zs=pathlib.Path('FORENSIC-ZIP/ZIP-SOURCE-STATUS.txt').read_text().strip()
          pathlib.Path('FORENSIC-AUDIT-XRAY.md').write_text(f'# FINAL FORENSIC XRAY AUDIT\n\n- Target canonical: `{os.environ["TARGET_CANONICAL_REF"]}`\n- ZIP source: `{os.environ["ZIP_SOURCE_REF"]}`\n- ZIP content status: **{zs}**\n- Canonical root entries: **{len(files)}**\n- Canonical root build: PASS\n- ROOTS isolation: PASS\n- Symlink-aware root: PASS\n- Generated dependencies excluded: PASS\n',encoding='utf-8')
          PY
      - name: Persist root and evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROOTS/openclaw OPENCLAW-ROOT-MANIFEST.md FORENSIC-ZIP/ZIP-SOURCE-CROSSCHECK.md FORENSIC-ZIP/ZIP-SOURCE-STATUS.txt FORENSIC-AUDIT-XRAY.md
          if ! git diff --cached --quiet; then git commit -m "build: reconstruct verified OpenClaw root"; if [ -n "${GITHUB_HEAD_REF:-}" ]; then git push origin "HEAD:${GITHUB_HEAD_REF}"; else git push origin "HEAD:${GITHUB_REF_NAME}"; fi; fi
      - name: Remote read-back
        run: |
          test -f ROOTS/openclaw/package.json; test -f ROOTS/openclaw/pnpm-workspace.yaml; test -f ROOTS/openclaw/node-version.mjs
          test ! -d ROOTS/openclaw/node_modules; test ! -d ROOTS/openclaw/.pnpm-store
