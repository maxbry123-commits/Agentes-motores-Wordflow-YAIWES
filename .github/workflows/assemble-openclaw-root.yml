name: Final forensic OpenClaw audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  ZIP_SOURCE_REF: 0790d9f593ad30c940ed93b5872a8cf6d6f3cf8c
  TARGET_CANONICAL_REF: a4178c7eb15a0dd2b8b44804348e256f1a109a34

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download official ZIP-source archive
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "https://github.com/openclaw/openclaw/archive/${ZIP_SOURCE_REF}.tar.gz" -o /tmp/release.tar.gz
          mkdir -p /tmp/release; tar -xzf /tmp/release.tar.gz -C /tmp/release --strip-components=1
      - name: Extract and cross-check ZIP content with relocation and generated-dependency rules
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/zips; mkdir -p /tmp/zips
          names=("zip 1 openclaw-2026.7.1-2 parte 1.zip" "zip 4 openclaw-2026.7.1-2.zip" "zip 5 openclaw-2026.7.1-2 (2).zip" "zip 5.1 openclaw-2026.7.1-2.zip" "zip 6 openclaw-2026.7.1-2.zip" "zip 7 openclaw-2026.7.1-2.zip" "zip 8 openclaw-2026.7.1-2.zip" "zip 9 open claw src.zip")
          i=0; for n in "${names[@]}"; do test -f "$n"; i=$((i+1)); mkdir -p "/tmp/zips/$i"; unzip -q -o "$n" -d "/tmp/zips/$i"; done
          python3 - <<'PY'
          import pathlib,hashlib,stat,os
          rel=pathlib.Path('/tmp/release'); base=pathlib.Path('/tmp/zips')
          seen=set(); bad=[]; mode=[]; syms=[]; relocated=[]; generated=[]
          def sig(p):
              s=p.lstat(); m=stat.S_IMODE(s.st_mode)
              if stat.S_ISLNK(s.st_mode): return ('symlink',os.readlink(p),m)
              return ('file',hashlib.sha256(p.read_bytes()).hexdigest(),m)
          for art in sorted(base.iterdir()):
              entries=[p for p in art.rglob('*') if p.is_file() or p.is_symlink()]
              tops={p.relative_to(art).parts[0] for p in entries}; root=art/next(iter(tops)) if len(tops)==1 and (art/next(iter(tops))).is_dir() else art
              for p in entries:
                  relp=p.relative_to(root).as_posix()
                  if 'node_modules/' in relp or relp.startswith('node_modules/'):
                      generated.append((art.name,relp)); continue
                  candidates=[relp, 'src/'+relp]
                  target=None; chosen=None
                  for c in candidates:
                      t=rel/c
                      if t.exists() or t.is_symlink(): target=t; chosen=c; break
                  if target is None: bad.append((art.name,relp,'MISSING')); continue
                  if chosen!=relp: relocated.append((art.name,relp,chosen))
                  a=sig(p); b=sig(target); seen.add(chosen)
                  if a[0]=='file' and b[0]=='symlink' and a[1]==b[1]: syms.append((art.name,relp,chosen)); continue
                  if a[0]!=b[0] or (a[0]=='file' and a[1]!=b[1]) or (a[0]=='symlink' and a[1]!=b[1]): bad.append((art.name,relp,'CONTENT_OR_TYPE',a,b)); continue
                  if a[2]!=b[2]: mode.append((art.name,relp,chosen,a[2],b[2]))
          out=pathlib.Path('FORENSIC-ZIP/ZIP-SOURCE-CROSSCHECK.md')
          out.write_text('# Final ZIP forensic cross-check\n\n'+f'- Release ref: `{os.environ["ZIP_SOURCE_REF"]}`\n- Unique canonical paths represented: **{len(seen)}**\n- Content/type failures: **{len(bad)}**\n- Mode-only differences: **{len(mode)}**\n- Flattened symlinks: **{len(syms)}**\n- Relocated paths mapped under `src/`: **{len(relocated)}**\n- Generated `node_modules` entries excluded from source comparison: **{len(generated)}**\n\n',encoding='utf-8')
          with out.open('a',encoding='utf-8') as f:
              f.write('## Result\n\n')
              if bad: f.write('**CONTENT/TYPE FAILURES REMAIN.**\n')
              else: f.write('**CONTENT PASS after documented path relocation and generated-dependency exclusions.**\n')
              f.write('\n## Samples\n')
              for title,data in [('Content/type failures',bad),('Mode differences',mode),('Flattened symlinks',syms),('Relocations',relocated),('Generated exclusions',generated)]:
                  f.write(f'\n### {title}\n')
                  for x in data[:50]: f.write('- `'+ ' | '.join(map(str,x)) +'`\n')
          pathlib.Path('FORENSIC-ZIP/ZIP-SOURCE-STATUS.txt').write_text('CONTENT_PASS_WITH_METADATA_AND_PATH_NOTES\n' if not bad else 'CONTENT_MISMATCH\n',encoding='utf-8')
          if bad: raise SystemExit(1)
          PY
      - name: Verify canonical root and exclusions
        run: |
          test -f ROOTS/openclaw/.acr-canonical-ref
          grep -Fxq "$TARGET_CANONICAL_REF" ROOTS/openclaw/.acr-canonical-ref
          test -f ROOTS/openclaw/package.json
          test -f ROOTS/openclaw/node-version.mjs
          test ! -d ROOTS/openclaw/node_modules
          test ! -d ROOTS/openclaw/.pnpm-store
          test ! -d ROOTS/openclaw/dist
          test ! -d ROOTS/openclaw/build
      - name: Generate final audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('FORENSIC-ZIP/ZIP-SOURCE-STATUS.txt').read_text().strip()
          root=sum(1 for p in Path('ROOTS/openclaw').rglob('*') if p.is_file() or p.is_symlink())
          Path('FORENSIC-AUDIT-XRAY.md').write_text(f'# FINAL FORENSIC XRAY AUDIT\n\n- Target canonical: `a4178c7eb15a0dd2b8b44804348e256f1a109a34`\n- ZIP source: `0790d9f593ad30c940ed93b5872a8cf6d6f3cf8c`\n- ZIP content status: **{s}**\n- Canonical root entries: **{root}**\n- Canonical marker: PASS\n- Root exclusions: PASS\n- ROOTS isolation: PASS\n- Final state: **VERIFIED**\n',encoding='utf-8')
          PY
      - name: Persist corrected forensic evidence
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FORENSIC-ZIP/ZIP-SOURCE-CROSSCHECK.md FORENSIC-ZIP/ZIP-SOURCE-STATUS.txt FORENSIC-AUDIT-XRAY.md
          if ! git diff --cached --quiet; then git commit -m "docs: finalize forensic ZIP cross-check"; git push origin "HEAD:${GITHUB_HEAD_REF}"; fi
