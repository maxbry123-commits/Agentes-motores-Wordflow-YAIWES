name: Assemble verified OpenClaw root

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  CANONICAL_REF: a4178c7eb15a0dd2b8b44804348e256f1a109a34
  SOURCE_RUN_ID: "32529275113"

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all verified ZIP extraction artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          pattern: acr-zip*-extracted
          path: /tmp/zip-artifacts
          merge-multiple: false

      - name: Download official canonical archive
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "https://github.com/openclaw/openclaw/archive/${CANONICAL_REF}.tar.gz" -o /tmp/openclaw.tar.gz
          mkdir -p /tmp/openclaw
          tar -xzf /tmp/openclaw.tar.gz -C /tmp/openclaw --strip-components=1
          test -f /tmp/openclaw/package.json
          printf '%s\n' "$(git hash-object /tmp/openclaw/package.json)" > /tmp/openclaw-package-gitsha

      - name: Verify every extracted ZIP file against canonical archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/zip-evidence
          mkdir -p /tmp/zip-evidence
          shopt -s nullglob
          for artifact in /tmp/zip-artifacts/acr-zip*-extracted; do
            name="$(basename "$artifact")"; mkdir -p "/tmp/zip-evidence/$name"; cp -a "$artifact"/. "/tmp/zip-evidence/$name/"
          done
          python3 - <<'PY'
          import hashlib, os, pathlib
          root=pathlib.Path('/tmp/openclaw'); base=pathlib.Path('/tmp/zip-evidence'); seen={}; mismatches=[]
          for art in sorted(base.iterdir()):
              if not art.is_dir(): continue
              ex=art/'extracted'; ex=ex if ex.exists() else art
              for p in ex.rglob('*'):
                  if not p.is_file(): continue
                  rel=p.relative_to(ex).as_posix(); target=root/rel; h=hashlib.sha256(p.read_bytes()).hexdigest()
                  if not target.is_file(): mismatches.append((art.name,rel,'MISSING_CANONICAL',h,'')); continue
                  ch=hashlib.sha256(target.read_bytes()).hexdigest(); seen.setdefault(rel,[]).append((art.name,h))
                  if h!=ch: mismatches.append((art.name,rel,'CONTENT_MISMATCH',h,ch))
          for rel, vals in seen.items():
              hs={h for _,h in vals}
              if len(hs)>1: mismatches.append(('CROSS-ZIP',rel,'ZIP_CONTENT_CONFLICT','|'.join(sorted(hs)),''))
          out=pathlib.Path('FORENSIC-ZIP/FINAL-CROSSCHECK.md'); out.parent.mkdir(parents=True,exist_ok=True)
          with out.open('w',encoding='utf-8') as f:
              f.write('# Final ZIP ↔ canonical OpenClaw cross-check\n\n'); f.write(f'- Canonical ref: `{os.environ["CANONICAL_REF"]}`\n- ZIP-derived unique paths checked: **{len(seen)}**\n- Failures: **{len(mismatches)}**\n')
              if mismatches:
                  f.write('\n## FAILURES\n'); [f.write('- `'+'` | `'.join(r)+'`\n') for r in mismatches]
              else: f.write('\n## PASS\n')
          if mismatches: raise SystemExit(1)
          PY

      - name: Build complete isolated ROOTS/openclaw from canonical archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ROOTS/openclaw; mkdir -p ROOTS/openclaw
          rsync -a --exclude='.git/' --exclude='node_modules/' --exclude='.pnpm-store/' --exclude='dist/' --exclude='build/' --exclude='coverage/' --exclude='.cache/' --exclude='.tmp/' --exclude='logs/' /tmp/openclaw/ ROOTS/openclaw/
          printf '%s\n' "$CANONICAL_REF" > ROOTS/openclaw/.acr-canonical-ref

      - name: Generate manifest and forensic audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, os
          root=pathlib.Path('ROOTS/openclaw'); files=[p for p in root.rglob('*') if p.is_file()]
          with open('OPENCLAW-ROOT-MANIFEST.md','w',encoding='utf-8') as f:
              f.write('# OPENCLAW ROOT MANIFEST\n\n'); f.write(f'- Canonical ref: `{os.environ["CANONICAL_REF"]}`\n- Files: **{len(files)}**\n- ZIPs: cross-check evidence\n- Generated dependencies/build artifacts excluded.\n\n'); f.write('| Path | SHA-256 | Size | Mode |\n|---|---|---:|---|\n')
              for p in sorted(files): f.write(f'| `{p.relative_to(root).as_posix()}` | `{hashlib.sha256(p.read_bytes()).hexdigest()}` | {p.stat().st_size} | `{p.stat().st_mode & 0o777:03o}` |\n')
          with open('FORENSIC-AUDIT-XRAY.md','w',encoding='utf-8') as f: f.write(f'# FINAL FORENSIC XRAY AUDIT\n\n- Canonical: `{os.environ["CANONICAL_REF"]}`\n- Root files: **{len(files)}**\n- ZIP cross-check: PASS\n- ROOTS isolation: PASS\n- Generated dependencies excluded: PASS\n- Status: READY FOR REMOTE READ-BACK\n')
          PY

      - name: Persist root and evidence
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROOTS/openclaw OPENCLAW-ROOT-MANIFEST.md FORENSIC-ZIP/FINAL-CROSSCHECK.md FORENSIC-AUDIT-XRAY.md
          git diff --cached --quiet || git commit -m "build: reconstruct verified OpenClaw root"
          git push

      - name: Remote read-back
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          test -f ROOTS/openclaw/package.json; test -f ROOTS/openclaw/pnpm-workspace.yaml; test -f ROOTS/openclaw/node-version.mjs
          test ! -d ROOTS/openclaw/node_modules; test ! -d ROOTS/openclaw/.pnpm-store
