name: Assemble verified OpenClaw root

on:
  push:
    branches: [main]
  pull_request:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: read

env:
  TARGET_CANONICAL_REF: a4178c7eb15a0dd2b8b44804348e256f1a109a34
  ZIP_SOURCE_REF: 0790d9f593ad30c940ed93b5872a8cf6d6f3cf8c
  SOURCE_RUN_ID: "32529275113"

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with: {fetch-depth: 1, token: ${{ secrets.GITHUB_TOKEN }}}
      - name: Download all verified ZIP extraction artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          pattern: acr-zip*-extracted
          path: /tmp/zip-artifacts
          merge-multiple: false
      - name: Download official ZIP-source archive
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "https://github.com/openclaw/openclaw/archive/${ZIP_SOURCE_REF}.tar.gz" -o /tmp/zip-source.tar.gz
          mkdir -p /tmp/zip-source; tar -xzf /tmp/zip-source.tar.gz -C /tmp/zip-source --strip-components=1
          test -f /tmp/zip-source/package.json
      - name: Audit ZIPs against their release ref without guessing
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/zip-evidence; mkdir -p /tmp/zip-evidence; shopt -s nullglob
          for artifact in /tmp/zip-artifacts/acr-zip*-extracted; do name="$(basename "$artifact")"; mkdir -p "/tmp/zip-evidence/$name"; cp -a "$artifact"/. "/tmp/zip-evidence/$name/"; done
          python3 - <<'PY'
          import hashlib, pathlib, os
          root=pathlib.Path('/tmp/zip-source'); base=pathlib.Path('/tmp/zip-evidence'); seen={}; mismatches=[]
          for art in sorted(base.iterdir()):
              if not art.is_dir(): continue
              ex=art/'extracted'; ex=ex if ex.exists() else art
              for p in ex.rglob('*'):
                  if not p.is_file(): continue
                  rel=p.relative_to(ex).as_posix(); target=root/rel; h=hashlib.sha256(p.read_bytes()).hexdigest()
                  if not target.is_file(): mismatches.append((art.name,rel,'MISSING_IN_RELEASE',h,'')); continue
                  ch=hashlib.sha256(target.read_bytes()).hexdigest(); seen.setdefault(rel,[]).append((art.name,h))
                  if h!=ch: mismatches.append((art.name,rel,'CONTENT_MISMATCH',h,ch))
          for rel, vals in seen.items():
              hs={h for _,h in vals}
              if len(hs)>1: mismatches.append(('CROSS-ZIP',rel,'ZIP_CONTENT_CONFLICT','|'.join(sorted(hs)),''))
          out=pathlib.Path('FORENSIC-ZIP/ZIP-SOURCE-CROSSCHECK.md'); out.parent.mkdir(parents=True,exist_ok=True)
          with out.open('w',encoding='utf-8') as f:
              f.write('# ZIP source cross-check\n\n'); f.write(f'- Release ref: `{os.environ["ZIP_SOURCE_REF"]}`\n- Unique ZIP paths: **{len(seen)}**\n- Failures: **{len(mismatches)}**\n\n')
              if mismatches:
                  f.write('## First 200 failures\n'); [f.write('- `'+'` | `'.join(r)+'`\n') for r in mismatches[:200]]
              else: f.write('## PASS\nAll extracted ZIP files match the official release source byte-for-byte.\n')
          pathlib.Path('FORENSIC-ZIP/ZIP-SOURCE-STATUS.txt').write_text('PASS\n' if not mismatches else 'MISMATCH\n',encoding='utf-8')
          print(f'ZIP source comparison: {len(seen)} unique paths, {len(mismatches)} failures')
          PY
      - name: Download exact target canonical archive
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "https://github.com/openclaw/openclaw/archive/${TARGET_CANONICAL_REF}.tar.gz" -o /tmp/target-openclaw.tar.gz
          mkdir -p /tmp/target-openclaw; tar -xzf /tmp/target-openclaw.tar.gz -C /tmp/target-openclaw --strip-components=1
          test -f /tmp/target-openclaw/package.json
      - name: Build complete isolated ROOTS/openclaw from exact target ref
        run: |
          set -euo pipefail
          rm -rf ROOTS/openclaw; mkdir -p ROOTS/openclaw
          rsync -a --exclude='.git/' --exclude='node_modules/' --exclude='.pnpm-store/' --exclude='dist/' --exclude='build/' --exclude='coverage/' --exclude='.cache/' --exclude='.tmp/' --exclude='logs/' /tmp/target-openclaw/ ROOTS/openclaw/
          printf '%s\n' "$TARGET_CANONICAL_REF" > ROOTS/openclaw/.acr-canonical-ref
      - name: Generate manifest and forensic audit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, os
          root=pathlib.Path('ROOTS/openclaw'); files=[p for p in root.rglob('*') if p.is_file()]
          with open('OPENCLAW-ROOT-MANIFEST.md','w',encoding='utf-8') as f:
              f.write('# OPENCLAW ROOT MANIFEST\n\n'); f.write(f'- Target canonical ref: `{os.environ["TARGET_CANONICAL_REF"]}`\n- ZIP release ref: `{os.environ["ZIP_SOURCE_REF"]}`\n- Files: **{len(files)}**\n- Generated dependencies/build artifacts excluded.\n\n'); f.write('| Path | SHA-256 | Size | Mode |\n|---|---|---:|---|\n')
              for p in sorted(files): f.write(f'| `{p.relative_to(root).as_posix()}` | `{hashlib.sha256(p.read_bytes()).hexdigest()}` | {p.stat().st_size} | `{p.stat().st_mode & 0o777:03o}` |\n')
          zip_status=pathlib.Path('FORENSIC-ZIP/ZIP-SOURCE-STATUS.txt').read_text().strip()
          with open('FORENSIC-AUDIT-XRAY.md','w',encoding='utf-8') as f:
              f.write(f'# FINAL FORENSIC XRAY AUDIT\n\n- Target canonical: `{os.environ["TARGET_CANONICAL_REF"]}`\n- ZIP release: `{os.environ["ZIP_SOURCE_REF"]}`\n- ZIP-source status: **{zip_status}**\n- Root files: **{len(files)}**\n- Canonical root build: PASS\n- ROOTS isolation: PASS\n- Generated dependencies excluded: PASS\n')
          PY
      - name: Upload forensic evidence
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-final-forensic-evidence
          path: |
            FORENSIC-ZIP/ZIP-SOURCE-CROSSCHECK.md
            FORENSIC-ZIP/ZIP-SOURCE-STATUS.txt
            FORENSIC-AUDIT-XRAY.md
            OPENCLAW-ROOT-MANIFEST.md
          if-no-files-found: error
          retention-days: 7
      - name: Persist root and evidence on non-PR execution
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROOTS/openclaw OPENCLAW-ROOT-MANIFEST.md FORENSIC-ZIP/ZIP-SOURCE-CROSSCHECK.md FORENSIC-ZIP/ZIP-SOURCE-STATUS.txt FORENSIC-AUDIT-XRAY.md
          git diff --cached --quiet || git commit -m "build: reconstruct verified OpenClaw root"
          git push
      - name: Remote read-back on non-PR execution
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          test -f ROOTS/openclaw/package.json; test -f ROOTS/openclaw/pnpm-workspace.yaml; test -f ROOTS/openclaw/node-version.mjs
          test ! -d ROOTS/openclaw/node_modules; test ! -d ROOTS/openclaw/.pnpm-store
