name: Extract 119 main
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: extract-119-main
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
      - name: Paso 2 EXTRACT uno por uno
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y unzip
          python3 scripts/extract_inventory.py 'Download code/archivos'
