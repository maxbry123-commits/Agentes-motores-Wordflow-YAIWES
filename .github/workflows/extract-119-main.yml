name: Extract 119 main
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: extract-119-main
  cancel-in-progress: false
env:
  GIT_LFS_SKIP_SMUDGE: '1'
  GIT_LFS_SKIP_PUSH: '1'
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
      - name: off LFS hooks
        run: |
          git lfs uninstall || true
          git config lfs.allowincompletepush true
          git config filter.lfs.required false
          git config filter.lfs.smudge ''
          git config filter.lfs.clean ''
          git config filter.lfs.process ''
      - name: Paso 2 EXTRACT uno por uno
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y unzip
          python3 scripts/extract_inventory.py 'Download code/archivos'
