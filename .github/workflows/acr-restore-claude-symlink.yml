name: ACR restore CLAUDE.md symlink
on:
  push:
    branches:
      - acr/openclaw-motor-recovery-v2
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Git symlink
        run: |
          set -euo pipefail
          test -f ACR/source/root/AGENTS.md
          rm -f ACR/source/root/CLAUDE.md
          ln -s AGENTS.md ACR/source/root/CLAUDE.md
          test "$(readlink ACR/source/root/CLAUDE.md)" = "AGENTS.md"
          test "$(git ls-files -s -- ACR/source/root/CLAUDE.md | awk '{print $1}')" = "120000"
          test "$(git cat-file blob :ACR/source/root/CLAUDE.md)" = "AGENTS.md"
      - name: Commit and push only if changed
        run: |
          set -euo pipefail
          git config user.name "acr-recovery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ACR/source/root/CLAUDE.md
          git diff --cached --summary
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "CLAUDE_SYMLINK_ALREADY_VERIFIED"
            exit 0
          fi
          git commit -m "fix(acr): restore CLAUDE.md symlink"
          git push
