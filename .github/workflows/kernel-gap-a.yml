name: Kernel gap A camel K18-K26
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dest-main-serial
  cancel-in-progress: false
jobs:
  descarga-extraccion:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: ZIP gap A
        run: |
          set -euo pipefail
          ! command -v git-lfs
          ! git config --get-regexp '^filter\.lfs\.' >/dev/null 2>&1
          sudo apt-get update -y && sudo apt-get install -y zip unzip
          python3 scripts/research_download_kernel_a.py 'Core kernel razonamiento repo para Yaiwes' '_work/kernel-a'
      - name: EXTRACT kernel
        run: |
          set -euo pipefail
          python3 scripts/extract_kernel.py 'Core kernel razonamiento repo para Yaiwes'
