name: Kernel gap A camel K18-K26
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dest-main-serial
  cancel-in-progress: false
env:
  GIT_LFS_SKIP_SMUDGE: '1'
jobs:
  descarga-extraccion:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: ZIP gap A
        run: |
          set -euo pipefail
          git lfs uninstall --local || true
          sudo apt-get update -y && sudo apt-get install -y zip unzip
          python3 scripts/research_download_kernel_a.py 'Core kernel razonamiento repo para Yaiwes' '_work/kernel-a'
      - name: EXTRACT kernel
        run: python3 scripts/extract_kernel.py 'Core kernel razonamiento repo para Yaiwes'
