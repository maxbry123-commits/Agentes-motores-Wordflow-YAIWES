          GLM-5V-Turbo	https://github.com/zai-org/GLM-V
          MiniMax Code	https://github.com/MiniMax-AI/minimax-code
          OpenRoom	https://github.com/MiniMax-AI/OpenRoom
          MiniMax Skills	https://github.com/MiniMax-AI/skills
          Kimi Code CLI	https://github.com/MoonshotAI/kimi-code
          Kimi Agent SDK	https://github.com/MoonshotAI/kimi-agent-sdk
          Kimi K2	https://github.com/MoonshotAI/Kimi-K2
          DeepSeek Harness (dsh)	https://github.com/deepseek-ai/deepseek-harness
          Awesome DeepSeek Agent	https://github.com/deepseek-ai/awesome-deepseek-agent
          GitHub Copilot CLI	https://github.com/github/copilot-cli
          GitHub Copilot SDK	https://github.com/github/copilot-sdk
          GitHub Copilot App	https://github.com/github/app
          Qwen Code	https://github.com/QwenLM/qwen-code
          Codex	https://github.com/openai/codex
          OpenAI Skills	https://github.com/openai/skills
          Claude Code	https://github.com/anthropics/claude-code
          Claude Agent SDK — TypeScript	https://github.com/anthropics/claude-agent-sdk-typescript
          Claude Agent SDK — Python	https://github.com/anthropics/claude-agent-sdk-python
          Gemini CLI	https://github.com/google-gemini/gemini-cli
          Google Agent Skills	https://github.com/google/skills
          MiMo Code	https://github.com/XiaomiMiMo/MiMo-Code
          MiMo Skills	https://github.com/XiaomiMiMo/MiMo-Skills
          Llama Agentic System	https://github.com/meta-llama/llama-agentic-system
          Llama Stack	https://github.com/meta-llama/llama-stack
          Llama Cookbook	https://github.com/meta-llama/llama-cookbook
          NVIDIA Agent Skills	https://github.com/NVIDIA/skills
          NVIDIA-labs Object Oriented Agents (NOOA)	https://github.com/NVIDIA-NeMo/labs-OO-Agents
          NVIDIA AI-Q	https://github.com/NVIDIA-AI-Blueprints/aiq
          Atomic Agent	https://github.com/AtomicBot-ai/atomic-agent
          Atomic Chat	https://github.com/AtomicBot-ai/Atomic-Chat
          Atomic Hermes	https://github.com/AtomicBot-ai/atomic-hermes
          Atomic llama.cpp TurboQuant	https://github.com/AtomicBot-ai/atomic-llama-cpp-turboquant
          EOF
          while IFS=$'\t' read -r name repo; do
            name=$(printf '%s' "$name" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            repo=$(printf '%s' "$repo" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            test -n "$name"
            test -n "$repo"
            slug=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9][^a-z0-9]*#-#g; s#^-##; s#-$##')
            owner_repo=$(printf '%s' "$repo" | sed 's#https://github.com/##')
            src=".download-queue/src/$slug"
            rm -rf "$src"
            GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 --no-tags "https://x-access-token:${GITHUB_TOKEN}@github.com/${owner_repo}.git" "$src"
            rm -rf "$src/.git"
            rm -f ".download-queue/$slug.zip"
            ( cd "$src" && zip -q -r -9 -y "../../$slug.zip" . )
            unzip -tq ".download-queue/$slug.zip"
            rm -rf "$src"
            echo "PASS ZIP: $name"
          done < .download-queue/repos.tsv
      - name: Paso 2 - Extraer cada ZIP en su raiz
        shell: bash
        working-directory: repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export GIT_LFS_SKIP_SMUDGE=1
          export GIT_LFS_SKIP_PUSH=1
          git lfs uninstall || true
          git config lfs.allowincompletepush true
          git config http.postBuffer 524288000
          git config http.version HTTP/1.1
          find . -name .gitattributes -type f -print0 | xargs -0 -r sed -i '/filter=lfs/d' || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          import shutil, subprocess, time
          from pathlib import Path
          from zipfile import ZipFile, BadZipFile
          BATCH_LIMIT = 90 * 1024 * 1024
          root = Path('.')
          tsv = root / '.download-queue' / 'repos.tsv'
          def run(c):
              subprocess.run(c, check=True)
          def push(label):
              for attempt in range(1, 4):
                  try:
                      run(['git', 'fetch', 'origin', 'main'])
                      run(['git', 'rebase', 'origin/main'])
                      run(['git', 'push', 'origin', 'HEAD:main'])
                      print(f'PUSH PASS {label} attempt {attempt}')
                      return
                  except subprocess.CalledProcessError:
                      if attempt == 3:
                          raise
                      time.sleep(attempt * 2)
          def commit(n, label):
              if not n:
                  return
              run(['git', 'add', '-A'])
              if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode == 0:
                  return
              run(['git', 'commit', '-m', f'extract: lote {label}'])
              push(label)
          batch = 0
          batch_no = 0
          for line in tsv.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              name, repo = line.split('\t', 1)
              name = name.strip()
              repo = repo.strip()
              slug = ''.join((c.lower() if c.isalnum() else '-') for c in name).strip('-')
              while '--' in slug:
                  slug = slug.replace('--', '-')
              zp = root / '.download-queue' / f'{slug}.zip'
              if not zp.is_file() or zp.stat().st_size == 0:
                  raise SystemExit(f'ZIP ausente o vacio: {name}')
              dest = root / name
              shutil.rmtree(dest, ignore_errors=True)
              dest.mkdir(parents=True, exist_ok=True)
              try:
                  with ZipFile(zp) as z:
                      if z.testzip() is not None:
                          raise SystemExit(f'CRC failure in {name}')
                      seen = set()
                      count = 0
                      for info in z.infolist():
                          raw = info.filename.replace('\\', '/')
                          if not raw or raw.endswith('/'):
                              continue
                          p = Path(raw)
                          if p.is_absolute() or '..' in p.parts:
                              raise SystemExit(f'{name}: unsafe ZIP path: {raw}')
                          if raw in seen:
                              raise SystemExit(f'{name}: duplicate member: {raw}')
                          seen.add(raw)
                          target = (dest / raw).resolve()
                          if dest.resolve() not in target.parents:
                              raise SystemExit(f'{name}: extraction escape: {raw}')
                          target.parent.mkdir(parents=True, exist_ok=True)
                          with z.open(info) as src, target.open('wb') as dst:
                              shutil.copyfileobj(src, dst, length=1024 * 1024)
                          count += 1
                      if count == 0:
                          raise SystemExit(f'{name}: zero files extracted')
              except BadZipFile as exc:
                  raise SystemExit(f'{name}: invalid ZIP: {exc}')
              size = zp.stat().st_size
              print(f'PASS EXTRACT: {name} files={count} zip={size}')
              if batch and batch + size > BATCH_LIMIT:
                  commit(batch, f'{batch_no:03d}')
                  batch = 0
                  batch_no += 1
              batch += size
          commit(batch, f'{batch_no:03d}-final')
          PY
          rm -rf .download-queue
