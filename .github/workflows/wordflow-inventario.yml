name: Wordflow inventario
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wordflow-inventario
  cancel-in-progress: false
jobs:
  descarga-extraccion:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      GIT_LFS_SKIP_PUSH: "1"
    steps:
      - name: Paso 1 - Descargar ZIP
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export GIT_LFS_SKIP_SMUDGE=1
          export GIT_LFS_SKIP_PUSH=1
          sudo apt-get update -y
          sudo apt-get install -y zip unzip
          sudo apt-get remove -y git-lfs || true
          git lfs uninstall --system || true
          git lfs uninstall || true
          git config --global filter.lfs.required false
          git config --global filter.lfs.smudge cat
          git config --global filter.lfs.clean cat
          git config --global filter.lfs.process ''
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 --no-tags "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          mkdir -p .download-queue/src
          cat > .download-queue/repos.tsv <<'EOF'
          Guardians	https://github.com/metareflection/guardians
          Loop Engineer	https://github.com/SollanSystems/loop-engineer
          Agent-Zero	https://github.com/agent0ai/agent-zero
