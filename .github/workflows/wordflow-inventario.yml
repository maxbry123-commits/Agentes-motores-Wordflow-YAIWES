          LangChain Task Steering	https://github.com/edvinhallvaxhiu/langchain-task-steering
          ToolOrchestra	https://github.com/NVlabs/ToolOrchestra
          Sovereign-OS	https://github.com/Justin0504/Sovereign-OS
          Reyn	https://github.com/tya5/reyn
          Kaji	https://github.com/apokamo/kaji
          Prime Agent	https://github.com/PrimeIntellect-ai/prime-agent
          Grok Build	https://github.com/xai-org/grok-build
          Qwen-UI-Agent	https://github.com/Tongyi-MAI/MAI-UI
          Codex Security	https://github.com/openai/codex-security
          Kimi K3 Agent Swarm	https://github.com/MoonshotAI/Kimi-K3
          GLM-5.3-Flash	https://github.com/zai-org/glm-5
          Qwen3.5 Agent	https://github.com/QwenLM/Qwen3.5
          Hyundai Physical-AI Stack	https://github.com/boston-dynamics/spot-sdk
          Artificial Agent Lab	https://github.com/BY571/artificial-agent-lab
          Swarm Agent	https://github.com/desplega-ai/agent-swarm
          Bernstein	https://github.com/sipyourdrink-ltd/bernstein
          Arena of Autonomous Threads	https://github.com/rafaelmateo123/Arena-of-Autonomous-Threads
          OSS Agent Lab	https://github.com/jeremylongshore/oss-agent-lab
          Aiyu Multi-Agent	https://github.com/teeprakorn1/aiyu-multi-agent
          OpenAlice	https://github.com/TraderAlice/OpenAlice
          Dr. Claw	https://github.com/OpenLAIR/dr-claw
          AgentSPEX	https://github.com/ScaleML/AgentSPEX
          Agents Universe	https://github.com/agentuniverse-ai/agentUniverse
          Spice Agent Coding	https://github.com/spiceai/skills
          Jidoka	https://github.com/agentjido/jidoka
