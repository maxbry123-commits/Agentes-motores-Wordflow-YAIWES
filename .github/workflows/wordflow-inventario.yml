name: Wordflow inventario
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wordflow-inventario
  cancel-in-progress: false
jobs:
  descarga-extraccion:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout main without LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Forensic preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          bad=[]
          for root in (Path('scripts'), Path('.github/workflows')):
              for p in root.rglob('*'):
                  if not p.is_file() or p.name=='wordflow-inventario.yml' or '__pycache__' in p.parts or p.suffix=='.pyc': continue
                  try: t=p.read_text(errors='ignore')
                  except Exception: continue
                  for token in ('git '+'lfs','GIT_'+'LFS_'):
                      if token in t: bad.append((str(p),token))
          if bad: raise SystemExit(f'FORENSIC FAIL: forbidden LFS operational reference: {bad}')
          print('FORENSIC PASS: workflow/scripts contain no operational LFS commands or env')
          PY
      - name: Paso 1 - Descargar ZIP 01-119
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y zip unzip
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/research_download_chain.py 'Download code/archivos' '_work/research-download'
      - name: Paso 2 - Extraer cada ZIP en su raiz
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/extract_inventory.py 'Download code/archivos'
