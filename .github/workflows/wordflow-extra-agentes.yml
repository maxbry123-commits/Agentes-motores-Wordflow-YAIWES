name: Wordflow extra agentes main
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wordflow-extra
  cancel-in-progress: false
jobs:
  descarga-extraccion:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Paso 1 ZIP extra
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y zip unzip
          python3 scripts/research_download_extra.py 'Download code/archivos' '_work/extra-download'
      - name: Paso 2 EXTRACT extra a main
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/extract_extra.py 'Download code/archivos'
