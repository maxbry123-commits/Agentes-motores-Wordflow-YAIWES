name: rm basura plantilla
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf 'skills agente Yaiwes' 'Download code Yaiwes' 'Documentos proyectos Yaiwes' Yaiwes 'Desplegar Yaiwes' 'Refactoria Yaiwes' 'PIPELINE Yaiwes' 'Método de trabajo Yaiwes' 'Agente motores Yaiwes'
          git add -A -- ':!.github'
          git diff --cached --quiet && exit 0
          git commit -m 'rm: plantillas vacias no pedidas'
          git pull --rebase origin main
          git push --no-verify origin main
