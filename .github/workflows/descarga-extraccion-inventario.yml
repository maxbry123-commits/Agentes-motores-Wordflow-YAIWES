Agentic Workflow Framework	https://github.com/JRA-CodingLab/agentic-workflow-framework
MetaAgent	https://github.com/SaFo-Lab/MetaAgent
Rasa	https://github.com/RasaHQ/rasa
Semantic Kernel	https://github.com/microsoft/semantic-kernel
DSPy	https://github.com/stanfordnlp/dspy
Agno	https://github.com/agno-agi/agno
Haystack	https://github.com/deepset-ai/haystack
SwarmClaw	https://github.com/swarmclawai/swarmclaw
SwarmDock	https://github.com/swarmclawai/swarmdock
Agent Framework Samples	https://github.com/microsoft/Agent-Framework-Samples
IntentKit	https://github.com/crestalnetwork/intentkit
PraisonAI	https://github.com/MervinPraison/PraisonAI
Trigger.dev	https://github.com/triggerdotdev/trigger.dev
Solace Agent Mesh	https://github.com/SolaceLabs/solace-agent-mesh
OpenRSI / Frontis-MA1 / OpenMLE	https://github.com/FrontisAI/openrsi
Claw AI Lab	https://github.com/Claw-AI-Lab/Claw-AI-Lab
