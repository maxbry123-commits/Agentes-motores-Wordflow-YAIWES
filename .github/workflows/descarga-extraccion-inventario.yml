EOF
          while IFS=$'\t' read -r name repo; do
            test -n "$name"
            if test -z "${repo:-}"; then
              echo "SIN_URL_NO_INVENTADA: $name"
              continue
            fi
            slug=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9][^a-z0-9]*#-#g; s#^-##; s#-$##')
            owner_repo=$(printf '%s' "$repo" | sed 's#https://github.com/##')
            branch=$(git ls-remote --symref "$repo.git" HEAD 2>/dev/null | awk '/^ref:/ {sub("refs/heads/", "", $2); print $2; exit}')
            test -n "$branch"
            curl --fail --location --retry 3 --retry-delay 2 -o ".download-queue/$slug.zip" "https://github.com/$owner_repo/archive/refs/heads/$branch.zip"
          done < .download-queue/repos.tsv
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Paso 2 - Extraer cada ZIP en su raíz
        shell: bash
        working-directory: repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import shutil, zipfile
          from pathlib import Path
          root = Path('.')
          tsv = root / '.download-queue' / 'repos.tsv'
          for line in tsv.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              parts = line.split('\t', 1)
              name = parts[0]
              repo = parts[1].strip() if len(parts) > 1 else ''
              if not repo:
                  continue
              slug = ''.join((c.lower() if c.isalnum() else '-') for c in name).strip('-')
              while '--' in slug:
                  slug = slug.replace('--', '-')
              zp = root / '.download-queue' / f'{slug}.zip'
              if not zp.is_file() or zp.stat().st_size == 0:
                  raise SystemExit(f'ZIP ausente: {name}')
              dest = root / name
              if dest.exists():
                  shutil.rmtree(dest)
              dest.mkdir(parents=True)
              seen = set()
              with zipfile.ZipFile(zp) as z:
                  bad = z.testzip()
                  if bad is not None:
                      raise SystemExit(f'CRC fail {name}: {bad}')
                  names = z.namelist()
                  tops = {n.split('/')[0] for n in names if n and not n.startswith('__MACOSX')}
                  if len(tops) != 1:
                      raise SystemExit(f'ZIP no tiene una sola raíz: {name} {tops}')
                  top = next(iter(tops))
                  for info in z.infolist():
                      raw = info.filename.replace('\\', '/')
                      if not raw or raw.endswith('/') or raw.startswith('__MACOSX') or raw.endswith('.DS_Store'):
                          continue
                      p = Path(raw)
                      if p.is_absolute() or '..' in p.parts:
                          raise SystemExit(f'unsafe ZIP path: {raw}')
                      if raw in seen:
                          raise SystemExit(f'duplicate member: {raw}')
                      seen.add(raw)
                      rel = Path(*p.parts[1:]) if p.parts and p.parts[0] == top else p
                      if not rel.parts:
                          continue
                      target = (dest / rel).resolve()
                      if dest.resolve() not in target.parents:
                          raise SystemExit(f'extraction escape: {raw}')
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(info) as src, target.open('wb') as dst:
                          shutil.copyfileobj(src, dst, length=1024 * 1024)
              if not any(dest.rglob('*')):
                  raise SystemExit(f'raíz vacía: {name}')
              print(f'PASS EXTRACT: {name}')
          PY
          rm -rf .download-queue
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "extract: raices individuales inventario en main"
          git pull --rebase origin main
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
