name: Descarga y extracción inventario
# INPUT BLOCK literal: 5 puntos del plan.
# 1 Destino Agentes-motores-Wordflow-YAIWES main; raíz = nombre exacto; ZIP completo; nada suelto; no mezclar.
# 2 Lista = inventario completo; sin filtrar; sin quitar; sin URL inventada.
# 3 Action solo esa lista; no reutilizar action anterior; no añadir repos fuera de lista.
# 4 Solo procedimiento del skill; ejemplo no es otro repo; sin tercer proceso.
# 5 PASO 1 ZIP → PASO 2 extraer en raíz exacta → main.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: descarga-extraccion-inventario
  cancel-in-progress: false

jobs:
  descarga-extraccion:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Paso 1 - Descargar ZIP
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          mkdir -p .download-queue
          cat > .download-queue/repos.tsv <<'EOF'
Guardians	https://github.com/metareflection/guardians
Loop Engineer	https://github.com/SollanSystems/loop-engineer
Agent-Zero	https://github.com/agent0ai/agent-zero
Awesome Agent Workflows	https://github.com/Richicinschi/awesome-agent-workflows
