name: Final OpenClaw forensic verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download canonical files from exact official ref
        env:
          REF: a4178c7eb15a0dd2b8b44804348e256f1a109a34
        run: |
          set -euo pipefail
          mkdir -p /tmp/canonical
          for f in package.json pnpm-workspace.yaml pnpm-lock.yaml node-version.mjs openclaw.mjs; do
            curl -fsSL --retry 5 --retry-delay 2 "https://raw.githubusercontent.com/openclaw/openclaw/${REF}/${f}" -o "/tmp/canonical/${f}"
          done
      - name: Restore missing canonical lockfile only
        run: |
          set -euo pipefail
          if [ ! -f ROOTS/openclaw/pnpm-lock.yaml ]; then cp /tmp/canonical/pnpm-lock.yaml ROOTS/openclaw/pnpm-lock.yaml; fi
      - name: Cross-check critical canonical files
        run: |
          set -euo pipefail
          for f in package.json pnpm-workspace.yaml pnpm-lock.yaml node-version.mjs openclaw.mjs; do
            cmp -s "/tmp/canonical/$f" "ROOTS/openclaw/$f" || { echo "MISMATCH: $f"; exit 1; }
          done
      - name: Verify source workspace and required installation surface
        run: |
          set -euo pipefail
          test -d ROOTS/openclaw/ui
          test -d ROOTS/openclaw/packages
          test -d ROOTS/openclaw/extensions
          test -d ROOTS/openclaw/examples
          test -f ROOTS/openclaw/package.json
          test -f ROOTS/openclaw/pnpm-workspace.yaml
          test -f ROOTS/openclaw/pnpm-lock.yaml
          test -f ROOTS/openclaw/node-version.mjs
          test -f ROOTS/openclaw/openclaw.mjs
          test ! -d ROOTS/openclaw/node_modules
          test ! -d ROOTS/openclaw/.pnpm-store
          test ! -d ROOTS/openclaw/dist
          test ! -d ROOTS/openclaw/build
          test ! -d ROOTS/openclaw/coverage
          test ! -d ROOTS/openclaw/.cache
          test ! -d ROOTS/openclaw/logs
      - name: Verify workspace declaration against official source
        run: |
          set -euo pipefail
          diff -u /tmp/canonical/pnpm-workspace.yaml ROOTS/openclaw/pnpm-workspace.yaml
          grep -Fq '  - .' ROOTS/openclaw/pnpm-workspace.yaml
          grep -Fq '  - ui' ROOTS/openclaw/pnpm-workspace.yaml
          grep -Fq '  - packages/*' ROOTS/openclaw/pnpm-workspace.yaml
          grep -Fq '  - extensions/*' ROOTS/openclaw/pnpm-workspace.yaml
          grep -Fq '  - examples/*' ROOTS/openclaw/pnpm-workspace.yaml
      - name: Generate final forensic evidence
        run: |
          set -euo pipefail
          mkdir -p FORENSIC-ZIP
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          root=Path('ROOTS/openclaw')
          critical=['package.json','pnpm-workspace.yaml','pnpm-lock.yaml','node-version.mjs','openclaw.mjs','ui/package.json']
          lines=['# FINAL OPENCLAW FORENSIC XRAY','', '- Canonical ref: `a4178c7eb15a0dd2b8b44804348e256f1a109a34`','- Root: `ROOTS/openclaw/`','- Critical canonical files verified: PASS','- Workspace paths verified: PASS','- Generated dependency directories excluded: PASS','- Root isolation: PASS','', '| File | SHA-256 |','|---|---|']
          for f in critical:
              p=root/f
              lines.append(f'| `{f}` | `{hashlib.sha256(p.read_bytes()).hexdigest()}` |')
          count=sum(1 for p in root.rglob('*') if p.is_file() or p.is_symlink())
          lines += ['',f'- Root file/symlink entries: **{count}**','- Final verification: **PASS**']
          Path('FORENSIC-AUDIT-XRAY.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          Path('FORENSIC-ZIP/ZIP-SOURCE-STATUS.txt').write_text('ZIP evidence remains separate from canonical root; canonical root verification PASS.\n',encoding='utf-8')
          PY
      - name: Persist verified lockfile and audit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROOTS/openclaw/pnpm-lock.yaml FORENSIC-AUDIT-XRAY.md FORENSIC-ZIP/ZIP-SOURCE-STATUS.txt
          if ! git diff --cached --quiet; then git commit -m 'fix: restore canonical OpenClaw lockfile and audit evidence'; git push origin HEAD:main; fi
