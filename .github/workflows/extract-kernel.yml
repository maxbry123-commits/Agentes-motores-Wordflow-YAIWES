name: Extract kernel zips
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dest-main-serial
  cancel-in-progress: false
env:
  GIT_LFS_SKIP_SMUDGE: '1'
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: EXTRACT kernel slugs
        run: |
          set -euo pipefail
          sudo apt-get update -y && sudo apt-get install -y unzip
          python3 scripts/extract_kernel.py 'Core kernel razonamiento repo para Yaiwes'
