name: Wordflow kernel razonamiento
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wordflow-kernel
  cancel-in-progress: false
jobs:
  descarga-extraccion:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Paso 1 ZIP kernel
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y zip unzip
          python3 scripts/research_download_kernel.py 'Core kernel razonamiento repo para Yaiwes' '_work/kernel-download'
      - name: Paso 2 EXTRACT kernel slugs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/extract_kernel.py 'Core kernel razonamiento repo para Yaiwes'
