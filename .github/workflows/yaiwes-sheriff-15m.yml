name: yaiwes-sheriff-15m
on:
  workflow_dispatch:
    inputs:
      apply_moves:
        description: 'mover docs a Documentos proyectos agentes'
        type: boolean
        default: false
      apply_delete_md:
        description: 'borrar md/texto no cableado'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: forensic preflight and status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time
          from pathlib import Path
          root=Path('.')
          dest_zip=root/'Download code'/'archivos'
          kernel=root/'Core kernel razonamiento repo para Yaiwes'
          docs=root/'Documentos proyectos agentes'; docs.mkdir(parents=True,exist_ok=True)
          main_m=dest_zip/'RESEARCH_DOWNLOAD_MANIFEST.jsonl'
          kernel_m=kernel/'RESEARCH_DOWNLOAD_MANIFEST.jsonl'
          extra_m=dest_zip/'EXTRA_AGENTS_MANIFEST.jsonl'
          def rows(p):
              if not p.exists(): return []
              return [json.loads(x) for x in p.read_text().splitlines() if x.strip()]
          mr,kr,er=rows(main_m),rows(kernel_m),rows(extra_m)
          bad=[]
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts: continue
              try: t=p.read_text(errors='ignore')
              except Exception: continue
              if 'git-lfs.github.com' in t or 'filter=lfs' in t: bad.append(str(p))
          st={
            'ts':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
            'main_manifest':len(mr),
            'main_complete':sum(r.get('status')=='COMPLETE' for r in mr),
            'kernel_manifest':len(kr),
            'kernel_complete':sum(r.get('status')=='COMPLETE' for r in kr),
            'extra_manifest':len(er),
            'extra_complete':sum(r.get('status')=='COMPLETE' for r in er),
            'lfs_pointer_files':bad,
          }
          if st['main_manifest'] not in (0,119): raise SystemExit(f'INVALID main manifest state: {st}')
          if st['main_manifest'] and st['main_complete']!=119: raise SystemExit(f'INCOMPLETE main manifest: {st}')
          if st['kernel_manifest'] not in (0,35): raise SystemExit(f'INVALID kernel manifest state: {st}')
          if st['kernel_manifest'] and st['kernel_complete']!=35: raise SystemExit(f'INCOMPLETE kernel manifest: {st}')
          if st['extra_manifest'] not in (0,3): raise SystemExit(f'INVALID extra manifest state: {st}')
          if st['extra_manifest'] and st['extra_complete']!=3: raise SystemExit(f'INCOMPLETE extra manifest: {st}')
          if bad: raise SystemExit(f'LFS pointer/config text detected: {bad}')
          (docs/'LOOP-STATUS.json').write_text(json.dumps(st,indent=2)+'\n')
          print(json.dumps(st,indent=2))
          PY
      - name: mover docs despliegue si apply_moves
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_moves }}
        run: |
          set -euo pipefail
          mkdir -p "Documentos proyectos agentes"
          for f in GUIA-DESPLIEGUE-ZIP-UNIVERSAL.md GUIA-DESPLIEGUE-ZIP-UNIVERSAL-PARCCHE-01.md; do
            if [ -f "$f" ]; then git mv -f "$f" "Documentos proyectos agentes/$f"; fi
          done
      - name: borrar md no cableado si apply_delete_md
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_delete_md }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          keep={'METODO-DE-TRABAJO.md','README.md','LICENSE'}
          keep_prefix=('GUIA-DESPLIEGUE',)
          for p in Path('.').glob('*.md'):
              if p.name in keep or p.name.startswith(keep_prefix): continue
              print('DELETE',p.name); p.unlink()
          PY
      - name: commit status fail-closed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then echo NOCHANGE; exit 0; fi
          git commit -m "chore(loop15): forensic status"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
