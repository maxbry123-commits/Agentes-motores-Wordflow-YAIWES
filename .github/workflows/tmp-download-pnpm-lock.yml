name: Extract canonical pnpm-lock
on:
  push:
    branches:
      - main
permissions:
  contents: write

jobs:
  extract:
    if: github.event.head_commit.message != 'ACR: extract pnpm-lock from zip [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract lockfile from zip
        shell: bash
        run: |
          set -euo pipefail
          test -f pnpm-lock.yaml.zip
          rm -rf /tmp/pnpm-lock-extract
          mkdir -p /tmp/pnpm-lock-extract
          unzip -q pnpm-lock.yaml.zip -d /tmp/pnpm-lock-extract
          test -f /tmp/pnpm-lock-extract/pnpm-lock.yaml.txt
          cp /tmp/pnpm-lock-extract/pnpm-lock.yaml.txt ROOTS/openclaw/pnpm-lock.yaml
          sha256sum ROOTS/openclaw/pnpm-lock.yaml | tee /tmp/lock.sha256
          grep -q 'cefd1fdf77f5c170ffacfad4b75e03c4c33345cf' /tmp/lock.sha256
      - name: Remove duplicate archive and root duplicate
        shell: bash
        run: |
          rm -f pnpm-lock.yaml.zip pnpm-lock.yaml.txt
      - name: Commit extracted canonical lockfile
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROOTS/openclaw/pnpm-lock.yaml
          git rm -f --ignore-unmatch pnpm-lock.yaml.zip pnpm-lock.yaml.txt
          git commit -m 'ACR: extract pnpm-lock from zip [skip ci]'
          git push
