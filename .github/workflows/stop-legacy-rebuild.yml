name: Stop legacy rebuild safely

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-downloads-no-lfs
  cancel-in-progress: true

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm legacy rebuild remains manual
        shell: bash
        run: |
          echo 'PASS: legacy automatic rebuild is frozen; no automatic workflow was reactivated'
