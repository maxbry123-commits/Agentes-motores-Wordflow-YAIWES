name: ACR ZIP XRAY Extraction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract-zip:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: zip1
            file: "zip 1 openclaw-2026.7.1-2 parte 1.zip"
          - id: zip4
            file: "zip 4 openclaw-2026.7.1-2.zip"
          - id: zip5
            file: "zip 5 openclaw-2026.7.1-2 (2).zip"
          - id: zip51
            file: "zip 5.1 openclaw-2026.7.1-2.zip"
          - id: zip6
            file: "zip 6 openclaw-2026.7.1-2.zip"
          - id: zip7
            file: "zip 7 openclaw-2026.7.1-2.zip"
          - id: zip8
            file: "zip 8 openclaw-2026.7.1-2.zip"
          - id: zip9
            file: "zip 9 open claw src.zip"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate archive
        env:
          ZIP_FILE: ${{ matrix.file }}
        run: |
          set -euo pipefail
          test -f "$ZIP_FILE"
          sha256sum "$ZIP_FILE" | tee sha256.txt
          unzip -t "$ZIP_FILE" | tee unzip-test.txt

      - name: Extract archive preserving relative paths
        env:
          ZIP_FILE: ${{ matrix.file }}
        run: |
          set -euo pipefail
          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          find extracted -type f -print0 | sort -z | xargs -0 -r sha256sum > extracted-sha256.txt
          find extracted -type f | sort > extracted-files.txt
          find extracted -type d | sort > extracted-dirs.txt
          printf 'archive=%s\n' "$ZIP_FILE" > manifest.txt
          printf 'archive_size_bytes=%s\n' "$(stat -c '%s' "$ZIP_FILE")" >> manifest.txt
          printf 'file_count=%s\n' "$(find extracted -type f | wc -l)" >> manifest.txt
          printf 'dir_count=%s\n' "$(find extracted -type d | wc -l)" >> manifest.txt

      - name: Upload verified extraction artifact
        uses: actions/upload-artifact@v4
        with:
          name: acr-${{ matrix.id }}-extracted
          path: |
            extracted
            manifest.txt
            sha256.txt
            unzip-test.txt
            extracted-sha256.txt
            extracted-files.txt
            extracted-dirs.txt
          if-no-files-found: error
          retention-days: 7

  aggregate:
    if: ${{ always() }}
    needs: [extract-zip]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download all extraction artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: acr-*-extracted
          path: FORENSIC-ZIP/artifacts
          merge-multiple: false

      - name: Record artifact IDs and extraction status
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.runId;
            const data = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100
            });
            const rows = data.data.artifacts.map(a => ({
              id: a.id,
              name: a.name,
              size_in_bytes: a.size_in_bytes,
              expired: a.expired,
              archive_download_url: a.archive_download_url
            }));
            require('fs').mkdirSync('FORENSIC-ZIP', {recursive:true});
            require('fs').writeFileSync(
              'FORENSIC-ZIP/ARTIFACT-INDEX.json',
              JSON.stringify({run_id: runId, status: context.payload.workflow_run?.conclusion ?? 'in_progress', artifacts: rows}, null, 2) + '\n'
            );

      - name: Build consolidated extraction index
        run: |
          set -euo pipefail
          {
            echo "# ZIP XRAY EXTRACTION RUN $GITHUB_RUN_ID"
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Workflow: ACR ZIP XRAY Extraction"
            echo
            echo "## Artifacts"
            find FORENSIC-ZIP/artifacts -maxdepth 2 -type f | sort || true
            echo
            echo "## Manifests"
            find FORENSIC-ZIP/artifacts -name manifest.txt -print -exec cat {} \; || true
          } > FORENSIC-ZIP/RUN-${GITHUB_RUN_ID}.md

      - name: Persist extraction evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FORENSIC-ZIP
          git commit -m "chore(acr): persist ZIP XRAY extraction evidence [skip ci]" || exit 0
          git push
