[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-workflow-framework"
version = "0.1.0"
description = "A lightweight multi-agent workflow framework: a stateful Manager orchestrates single-responsibility Worker agents through a pipeline, with shared state, checkpointed stop/resume, and a protected-core self-improvement loop."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "the author" }]
keywords = ["agents", "llm", "anthropic", "claude", "workflow", "orchestration", "multi-agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
# Core orchestration has no hard runtime dependency; `anthropic` is only needed
# for the live backend.
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.50"]
dev = ["anthropic>=0.50", "pytest>=8.0"]

[tool.setuptools]
packages = ["agentic_workflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
