normalized_findings:
  - id: ASL-C005-F001
    source: {type: manual, engine: null, original_id: null}
    category: capability.undeclared-runtime-prerequisites
    severity: medium
    confidence: high
    compatibility_layers: [capability-availability]
    targets: [openclaw, hermes-agent]
    location: {path: SKILL.md, start_line: 39, end_line: 54}
    evidence_refs: [ASL-C005-E004, ASL-C005-E008, ASL-C005-E010, ASL-C005-E012, ASL-C005-E013]
    explanation: The default workflow requires Python, Git, TruffleHog, subprocess execution, and an authenticated review-engine CLI, but no platform metadata gates those prerequisites.
    remediation: Document mandatory runtime requirements in the portable compatibility field and add platform-specific gates where they can be represented without reducing portability.
    disposition: confirmed

  - id: ASL-C005-F002
    source: {type: manual, engine: null, original_id: null}
    category: capability.external-data-and-credential-boundary
    severity: medium
    confidence: high
    compatibility_layers: [capability-availability, operational-suitability]
    targets: [openclaw, hermes-agent]
    location: {path: SKILL.md, start_line: 39, end_line: 45}
    evidence_refs: [ASL-C005-E004, ASL-C005-E006, ASL-C005-E007, ASL-C005-E011, ASL-C005-E013]
    explanation: Review bundles are passed to selected external model engines with preserved engine authentication and optional web access; a special trusted-maintainer path can also stage a bounded credential file for parallel tests.
    remediation: Require an explicit data-handling and credential-policy decision before use, keep the trusted testbox path disabled for untrusted code, and disable web access when it is not needed.
    disposition: confirmed

  - id: ASL-C005-F003
    source: {type: manual, engine: null, original_id: null}
    category: compatibility.symlink-portability
    severity: low
    confidence: high
    compatibility_layers: [package-structure, platform-packaging]
    targets: [agent-skills, openclaw, hermes-agent]
    location: {path: CLAUDE.md, start_line: null, end_line: null}
    evidence_refs: [ASL-C005-E009]
    explanation: CLAUDE.md is an internal symlink to AGENTS.md. The core format permits symlinks, but some archives, installers, and Windows environments may flatten, omit, or reject them.
    remediation: Preserve and verify the link during distribution, or duplicate the small instruction file where symlink portability cannot be guaranteed.
    disposition: confirmed

  - id: ASL-C005-F004
    source: {type: manual, engine: null, original_id: null}
    category: quality.large-executable-review-surface
    severity: low
    confidence: high
    compatibility_layers: [behavioral-conformance, operational-suitability]
    targets: [agent-skills, openclaw, hermes-agent]
    location: {path: scripts/autoreview, start_line: 1, end_line: 12627}
    evidence_refs: [ASL-C005-E010, ASL-C005-E011, ASL-C005-E012, ASL-C005-E013, ASL-C005-E014]
    explanation: The primary executable and hardening suite are large and security-sensitive. Static inspection can inventory their boundaries but cannot establish correct runtime behavior.
    remediation: Preserve focused automated tests, reproducible review provenance, and independent execution only in the separately approved disposable environment.
    disposition: confirmed

  - id: ASL-C005-F005
    source: {type: manual, engine: null, original_id: null}
    category: scanner.synthetic-secret-fixture
    severity: low
    confidence: high
    compatibility_layers: [operational-suitability]
    targets: [agent-skills, openclaw, hermes-agent]
    location: {path: tests/fixtures/typescript-sensitive-literals.ts, start_line: 1, end_line: 10}
    evidence_refs: [ASL-C005-E015]
    explanation: Credential-shaped strings are intentionally bundled as visibly fake scanner fixtures; a scanner may report them without recognizing their test context.
    remediation: Preserve fixture provenance and manually verify any future scanner alert before treating it as a live-secret incident or dismissing it.
    disposition: confirmed

disagreements: []

limitations:
  - No bundled script, harness, test, command, model engine, secret scanner, or network operation was executed.
  - No target OpenClaw or Hermes installation, platform, session, binary inventory, authentication state, network policy, or filesystem policy was supplied.
  - Script behavior, isolation guarantees, secret redaction, cleanup, and test outcomes remain unverified.
  - The four documentation URLs and two script-contained URLs were inventoried but not contacted.
  - Symlink behavior was established from the pinned Git object inventory, not from an installation or archive round trip.
