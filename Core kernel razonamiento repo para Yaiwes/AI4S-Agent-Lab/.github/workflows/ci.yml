name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  standard-library-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package from source distribution metadata
        run: python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Audit publication boundary
        run: python scripts/verify_publication.py
      - name: End-to-end toy experiment
        run: ai4s-agent-lab --output-dir /tmp/ai4s-demo --iterations 6 --run-id ci-demo
      - name: Verify delivered evidence
        run: |
          test -s /tmp/ai4s-demo/evidence.jsonl
          test -s /tmp/ai4s-demo/best_model.json
