# Schema de documento / handoff — maxbry-router
version: "1.0"
repo: maxbry-router
required_before_work:
  - context_documents
  - work_method_reference
  - verified_handoff
if_missing: BLOCK
handoff_is_not_full_traceability: true

document:
  id: string
  title: string
  mission_id: string
  task_id: string
  origin: string
  path: reception/<filename>
  content_type: md|yaml|json|txt
  requirements: []
  architecture_refs: []
  method_ref: "agentes/PIPELINE/00_METODO_TRABAJO_Y_ARQUITECTURA.md"
  forensic_ref: "agentes/PIPELINE/FORENSIC_CODE_AUDIT.md"

traceability:
  req_to_code: required_after_implementation
  code_to_test: required_after_implementation
  test_to_evidence: required_for_PASS
